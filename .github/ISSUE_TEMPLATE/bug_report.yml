name: Bug report
description: Report a reproducible problem in Cleverlist.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Issues are public. Do not include shopping lists, CloudKit invitation links, personal information, or signing material."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Cleverlist version
  - type: input
    id: os-version
    attributes:
      label: Operating-system version and device
